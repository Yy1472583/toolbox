<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<meta name="theme-color" content="#FAF6F0">
<title>四级备考台</title>
<!-- 四级备考台 · 独立部署版：单文件、零外链、离线可用；数据存本机浏览器，可用导出/导入 JSON 跨设备迁移 -->
<style>

/* ============== 设计系统 ==============
   三档卡片：primary(主卡/深阴影+左侧主色条) / default(信息卡/细边) / soft(提示卡/无边框)
   间距节奏：section 24 / card 12 / inline 6-10
   圆角：12 / 16 / 20 / 24 四档
   配色：橙色只用在 CTA、active 状态、关键强调；标题与数字走深色系 */
:root{
  --orange:#EA580C;       /* 主色：橙红（比 F97316 更克制，仅 CTA/active/重点） */
  --orange-soft:#FFF1E6;  /* 主色底：浅暖 */
  --orange-line:#FFD9B8;  /* 主色线：暖橙 */
  --ink:#1E293B;          /* 主文本：近黑 */
  --ink-2:#475569;        /* 次文本：暖深灰 */
  --muted:#94A3B8;        /* 元信息：暖灰 */
  --line:#E8E1D4;         /* 细边框：暖米灰 */
  --line-soft:#EFEAE0;    /* 极细分隔线 */
  --bg:#FAF6F0;           /* 页面背景：暖白单色 */
  --card:#FFFFFF;
  --green:#16A34A; --green-soft:#F0FDF4;
  --red:#DC2626; --red-soft:#FEF2F2;
  --amber:#D97706; --amber-soft:#FEF3C7;
  --blue:#2563EB; --blue-soft:#EFF6FF;
  --purple:#9333EA; --purple-soft:#FAF5FF;
  --shadow-sm:0 1px 2px rgba(30,41,59,.04);
  --shadow:0 1px 2px rgba(30,41,59,.04),0 8px 20px -12px rgba(30,41,59,.10);
  --shadow-lg:0 1px 2px rgba(30,41,59,.04),0 18px 36px -20px rgba(234,88,12,.20);
}
::selection{background:#FFD9B8;color:#7C2D12}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);min-height:100dvh;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  letter-spacing:.01em;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid rgba(234,88,12,.4);outline-offset:2px;border-radius:8px}
input,select,textarea{font-family:inherit;font-size:14px}
svg{display:inline-block;vertical-align:middle}

/* ============== 顶部 App 容器 ============== */
.app{max-width:1080px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px;letter-spacing:.02em}
.streak{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--orange);font-size:13px}
.streak.off{color:var(--muted)}
.streak svg{width:15px;height:15px}

/* ============== 导航 ============== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 8px;color:var(--muted);font-size:11px;min-height:56px;
  position:relative;transition:color .15s ease;
}
.tabbar button svg{width:21px;height:21px;stroke-width:1.8}
.tabbar button.on{color:var(--orange);font-weight:700}
.tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2.5px;background:var(--orange);border-radius:0 0 3px 3px}

/* ============== 卡片系统（三档） ============== */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);margin-bottom:8px}
.card h3,.card-primary h3{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.card h3 svg,.card-primary h3 svg{width:16px;height:16px;flex:none;color:var(--orange);stroke-width:2}
.card h3 .sub{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}

/* L1 主卡：左侧 3px 主色条 + 更大阴影，承载主要模块 */
.card-primary{
  background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--orange);
  border-radius:18px;padding:18px 20px;
  box-shadow:var(--shadow);
  margin-bottom:8px;position:relative;
}
/* L2 信息卡：默认样式 */
.card{}
/* L3 提示卡：米色无边框，用于次要/提示性内容 */
.card-soft{background:#FBF7F1;border:1px dashed #ECE2D2;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card-soft h3{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}

/* ============== section 分组（解决"组合在一起没设计感"的核心） ============== */
.section{margin-bottom:24px}
.section:last-child{margin-bottom:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.section-head h4{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.section-head h4::before{content:'';width:3px;height:13px;background:var(--orange);border-radius:2px;display:inline-block}
.section-head .meta{font-size:12px;color:var(--muted)}

/* ============== 通用原子 ============== */
.muted{color:var(--muted);font-size:12.5px;line-height:1.6}
.muted-2{color:var(--ink-2);font-size:13px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.all-clear{padding:18px 8px;text-align:center;color:var(--green);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.all-clear svg{width:16px;height:16px}

/* ============== 按钮 ============== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;
  background:var(--orange);color:#fff;
  box-shadow:0 4px 10px -5px rgba(234,88,12,.45);
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  letter-spacing:.02em;
}
.btn.ghost{background:var(--orange-soft);color:var(--orange);box-shadow:none}
.btn.gray{background:#F1F5F9;color:var(--ink-2);box-shadow:none}
.btn.line{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.red{background:var(--red);box-shadow:none}
.btn.green{background:var(--green);box-shadow:none}
.btn.amber{background:var(--amber);box-shadow:none}
@media(hover:hover){
  .btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 16px -8px rgba(234,88,12,.55)}
  .btn.ghost:not(:disabled):hover{background:#FFE5D0}
  .btn.gray:not(:disabled):hover{background:#E2E8F0}
  .btn.line:not(:disabled):hover{border-color:#C8B89E;background:#FBF7F1}
  .btn:not(:disabled):active{transform:translateY(0)}
}
.btn.sm{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.5)}
.btn.block{width:100%}

/* ============== 今天要处理 / 任务清单 ============== */
.todo-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  background:#FBF7F1;border:1px solid transparent;margin-bottom:8px;
  transition:background .12s ease;
}
.todo-item:last-child{margin-bottom:0}
.todo-item.urgent{background:#FEF2F2;border-color:#FECACA}
.todo-item .txt{flex:1;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.todo-item .txt b{font-size:14px;color:var(--ink);font-weight:700}
.todo-item.urgent .txt{color:var(--red)}
.todo-item.urgent .txt b{color:var(--red)}
.task-line{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;color:var(--ink-2)}
.task-line+.task-line{border-top:1px solid var(--line-soft)}
.task-line .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #DDD3BE;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.task-line .box svg{width:12px;height:12px}
.task-line.done .box{background:var(--green);border-color:var(--green);color:#fff}
.task-line.done span:last-child{color:var(--muted);text-decoration:line-through;text-decoration-color:#CBD5E1}

/* ============== 复习计划 ============== */
.plan-card .pp-bar{display:flex;gap:6px;margin:2px 0 14px}
.pp-seg{flex:1;min-width:0}
.pp-track{height:10px;border-radius:6px;background:#EFEAE0;overflow:hidden}
.pp-fill{height:100%;border-radius:6px;transition:width .3s ease}
.pp-cap{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-cap b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#EFEAE0;color:var(--ink-2);align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.pp-cap.on{color:var(--orange);font-weight:700}
.pp-cap.on b{background:var(--orange);color:#fff}
.pp-now{font-size:13px;color:var(--ink-2);background:#FBF7F1;border-radius:10px;padding:10px 12px;margin-bottom:2px;line-height:1.6}
.pp-now b{color:var(--ink);font-weight:700}
.plan-focus{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:2px}
.plan-focus li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.plan-focus li::before{content:'';position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.auto{font-style:normal;font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* ============== 写译 / 阅读 / 技巧 模块 ============== */
.tabbar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabbar button{flex:none;min-width:62px}
.wl-prompt{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line-soft)}
.wl-prompt:first-child{border-top:none}
.wl-prompt .grow{display:flex;flex-direction:column;gap:3px;min-width:0}
.wl-item{padding:12px 0;border-top:1px solid var(--line-soft)}
.wl-item:first-child{border-top:none}
.wl-item .q{font-size:13.5px;color:var(--ink);margin:4px 0;line-height:1.5}
.wl-item .a{font-size:13px;color:var(--ink-2);line-height:1.55;white-space:pre-wrap}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.skill-card.ok{border-color:var(--green);background:var(--green-soft)}
.skill-card h3{font-size:14px;font-weight:700;color:var(--ink);margin:0}
.skill-sub{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;letter-spacing:.04em}
@media(max-width:680px){.skill-grid{grid-template-columns:1fr}}

/* ============== 环形进度 ============== */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:26px;line-height:1;color:var(--ink);font-weight:800;letter-spacing:-.02em}
.ring .num span{font-size:11px;color:var(--muted);margin-top:3px}

/* ============== 打卡日历 ============== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{text-align:center;font-size:10px;color:var(--muted);padding-bottom:4px;font-weight:600;letter-spacing:.04em}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#F5EFE4;color:#C8B89E;font-size:12px;font-weight:600;position:relative}
.cal-day.l1{background:#FFE0BE;color:#9A3412}
.cal-day.l2{background:#FB923C;color:#fff}
.cal-day.l3{background:#EA580C;color:#fff}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--ink);font-weight:800;color:var(--ink)}
.cal-day.l1.today,.cal-day.l2.today,.cal-day.l3.today{color:inherit}
.cal-day.has::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--orange)}
.cal-stats{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.cal-mini-stats{display:flex;justify-content:space-around;font-size:11.5px;color:var(--ink-2);margin-top:20px;padding-top:10px;border-top:1px solid var(--line-soft);line-height:1.6}
.cal-mini-stats b{color:var(--ink);font-weight:700}
.cal-streak{font-size:12px;color:var(--muted);margin-bottom:36px;text-align:center;line-height:1.6}
.cal-streak b{color:var(--ink);font-weight:700;font-size:14px}
.cal-toggle{width:100%;min-height:32px;margin-top:10px;font-size:12px;color:var(--ink-2);font-weight:600;border-radius:8px}
.cal-toggle:hover{background:#F5EFE4}

/* ============== 倒计时（Hero 内的核心数据） ============== */
.cd-num{font-size:54px;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd-num span{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.cd-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.cd-date{font-size:12px;color:var(--ink-2);margin-top:4px}

/* ============== 进度条 ============== */
.bar{height:6px;border-radius:99px;background:#F1EADC;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FB923C,var(--orange));border-radius:99px;transition:width .3s ease}
.bar.dark i{background:var(--ink)}

/* ============== PC 端补充 ============== */
.hero{display:none}
.pc-only{display:none}
.week{display:flex;align-items:flex-end;gap:8px;height:159px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wnum{font-size:11px;color:var(--ink-2);min-height:14px;font-weight:600}
.wnum.empty{color:#C8B89E}
.wbar{width:100%;max-width:20px;border-radius:4px 4px 2px 2px;background:#F1EADC;min-height:4px;flex:0 0 auto}
.wbar.hot{background:linear-gradient(180deg,#FB923C,var(--orange))}
.wbar.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wlab{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.wlab.today{color:var(--ink);font-weight:700}
.cause-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
.cause-row+.cause-row{border-top:1px solid var(--line-soft)}
.cause-row .nm{width:60px;flex:none;color:var(--ink-2);font-weight:500}
.cause-row .bar{flex:1;height:6px;border-radius:99px;background:#F1EADC;overflow:hidden}
.cause-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FB923C,var(--orange))}
.cause-row b{width:30px;flex:none;text-align:right;font-weight:700;color:var(--ink)}
.guide-row{display:flex;gap:10px;padding:9px 0;font-size:13px;line-height:1.6;align-items:flex-start;color:var(--ink-2)}
.guide-row+.guide-row{border-top:1px solid var(--line-soft)}
.guide-row:last-child{padding-bottom:0}
.guide-row .chip-n{flex:none;font-weight:700;color:#fff;background:var(--orange);border-radius:6px;padding:2px 8px;font-size:11px;margin-top:1px;letter-spacing:.04em;min-width:42px;text-align:center}
.guide-row .chip-n.dim{background:#94A3B8}
.lv-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#F1EADC;margin:6px 0 10px}
.lv-bar i{display:block;height:100%;transition:width .3s ease}
.lv-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--muted)}
.lv-legend span{display:flex;align-items:center;gap:5px}
.lv-legend i{width:9px;height:9px;border-radius:2px;flex:none}
.lv-legend b{color:var(--ink);font-weight:700}

/* ============== 横幅 ============== */
.banner{
  display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid #FDE68A;
  color:#92400E;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.55;
}
.banner .grow{flex:1}
.banner .x{margin-left:6px;color:#92400E;font-size:18px;padding:4px 8px;opacity:.6;line-height:1}
.banner .x:hover{opacity:1}

/* ============== 表单 ============== */
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);
  transition:border-color .12s ease,box-shadow .12s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(234,88,12,.1)}
.field textarea{min-height:72px;resize:vertical;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============== 记录列表 ============== */
.log-item{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13px}
.log-item+.log-item{border-top:1px solid var(--line-soft)}
.log-item .del{margin-left:auto;opacity:0;transition:opacity .15s ease}
.log-item:hover .del{opacity:1}
.tag{flex:none;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;letter-spacing:.02em}
.tag.listening{background:#FFEDD5;color:#C2410C}
.tag.reading{background:#DBEAFE;color:#1D4ED8}
.tag.writing{background:#DCFCE7;color:#15803D}
.tag.translating{background:#F3E8FF;color:#7E22CE}
.del{color:var(--muted);padding:8px;min-width:36px;min-height:36px;font-size:16px;line-height:1}
.del:hover{color:var(--red)}

/* ============== 错本 ============== */
.err-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff;transition:border-color .12s ease}
.err-item.due{border-color:#FCA5A5;background:#FFF8F8}
.err-item.due-strong{border-left:3px solid var(--red);background:#FFF8F8}
.err-item .q{font-size:13.5px;line-height:1.55;margin:8px 0 4px;color:var(--ink);font-weight:500}
.err-item .a{font-size:12.5px;color:var(--muted);line-height:1.55}
.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;background:#F1F5F9;color:var(--ink-2);margin-right:4px;font-weight:600;letter-spacing:.02em}
.badge.red{background:#FEE2E2;color:var(--red)}
.badge.orange{background:#FFEDD5;color:#C2410C}
.badge.gray{background:#F1F5F9;color:var(--ink-2)}
.filter-row{display:flex;gap:8px;margin-bottom:12px}
.filter-row select{flex:1;min-height:36px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:12.5px}

/* ============== 生词本 ============== */
.vocab-item{display:flex;align-items:center;gap:10px;padding:10px 0}
.vocab-item+.vocab-item{border-top:1px solid var(--line-soft)}
.vocab-item .w{font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.01em}
.vocab-item .ph{color:var(--muted);font-size:12.5px;margin-left:4px}
.vocab-item .d{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.vocab-item .actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.vocab-item .speak{color:var(--muted);padding:6px;border-radius:6px}
.vocab-item .speak:hover{color:var(--orange);background:var(--orange-soft)}

/* ============== 翻卡 overlay ============== */
.deck-mask{
  position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
  flex-direction:column;min-height:100dvh;
}
.deck-mask.show{display:flex}
.deck-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
.deck-top .prog{font-weight:700;color:var(--orange);font-size:13px;background:var(--orange-soft);padding:4px 12px;border-radius:99px}
.deck-close{font-size:13px;color:var(--ink-2);padding:8px 12px;min-width:44px;min-height:44px;border-radius:8px;font-weight:600}
.deck-close:hover{background:#F1EADC}
.flip-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px;perspective:1200px}
.flip{width:100%;max-width:420px;height:min(56dvh,420px);position:relative;transform-style:preserve-3d;transition:transform .25s ease-out;cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(30,41,59,.04),0 20px 50px -20px rgba(30,41,59,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;
}
.face.back{transform:rotateY(180deg)}
.face .word{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.1;word-break:break-word;color:var(--ink)}
.face .phonetic{font-size:18px;color:var(--muted);margin-top:14px;letter-spacing:.02em}
.face .hint{position:absolute;bottom:22px;font-size:12px;color:#B7A98F;font-weight:500}
.face .pos{font-size:14px;color:var(--orange);font-weight:700;margin-bottom:10px;background:var(--orange-soft);padding:3px 10px;border-radius:6px;letter-spacing:.04em}
.face .def{font-size:24px;font-weight:700;line-height:1.4;color:var(--ink);letter-spacing:-.01em}
.face .coll{font-size:14px;color:var(--ink-2);margin-top:14px;line-height:1.5}
.face .eg{font-size:15px;margin-top:16px;line-height:1.65;color:var(--ink-2)}
.face .egcn{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.speak-btn{margin-top:14px;width:44px;height:44px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease}
.speak-btn:hover{background:#FFE0BE;transform:scale(1.05)}
.speak-btn svg{width:20px;height:20px}
.deck-actions{display:flex;gap:12px;padding:16px 20px calc(20px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.deck-actions .btn{flex:1;height:54px;font-size:15px;border-radius:14px}

/* 清零庆祝 */
.finish-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.stamp{
  border:3px solid var(--orange);color:var(--orange);padding:10px 24px;border-radius:14px;
  font-size:28px;font-weight:800;transform:rotate(-6deg);animation:stampIn .35s ease-out;letter-spacing:.05em;
  background:#fff;
}
@keyframes stampIn{0%{transform:rotate(-6deg) scale(2.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.confetti{position:fixed;top:-20px;width:9px;height:15px;z-index:99;border-radius:2px;animation:fall 1.9s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(108dvh) rotate(640deg);opacity:.85}}

/* ============== 自测 ============== */
.quiz-opt{
  display:block;width:100%;text-align:left;min-height:48px;padding:12px 16px;margin-bottom:8px;
  border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14px;color:var(--ink);
  transition:border-color .12s ease,background .12s ease;
}
.quiz-opt:hover:not(:disabled){border-color:var(--orange);background:#FFFAF5}
.quiz-opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.quiz-opt:disabled{cursor:default}
.score-big{font-size:54px;font-weight:800;color:var(--ink);text-align:center;line-height:1.1;letter-spacing:-.03em}

/* ============== 拼写检测 ============== */
.spell-answer{min-height:50px;letter-spacing:8px;font-size:26px;font-weight:800;text-align:center;border-bottom:2px dashed #D4C8B0;margin:0 6px 14px;color:var(--ink);padding-left:8px}
.spell-answer.right{color:var(--green);border-color:var(--green)}
.spell-answer.wrong{color:var(--red);border-color:var(--red)}
.spell-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 4px}
.tile{width:40px;height:48px;border-radius:10px;background:var(--orange-soft);color:var(--orange);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,background .12s ease}
.tile:hover:not(.used){background:#FFE0BE;transform:translateY(-1px)}
.tile.used{opacity:.22;pointer-events:none}
.spell-correct{text-align:center;color:var(--red);font-size:13px;margin-top:12px}

/* ============== 选词填空 ============== */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:36px;padding:5px 14px;border-radius:99px;background:var(--orange-soft);color:var(--orange);font-weight:600;font-size:13px;letter-spacing:.01em;transition:background .12s ease,transform .12s ease}
.chip:hover:not(.used){background:#FFE0BE}
.chip.sel{outline:2px solid var(--orange);background:#FFE0BE}
.chip.used{opacity:.22;pointer-events:none}
.cloze-item{padding:11px 0}
.cloze-item+.cloze-item{border-top:1px solid var(--line-soft)}
.cloze-sent{font-size:14px;line-height:1.9}
.cloze-cn{font-size:12.5px;color:var(--muted);margin-top:2px}
.blank{min-width:74px;min-height:34px;border:none;border-bottom:2px solid var(--orange);background:var(--orange-soft);color:var(--orange);font-weight:700;font-size:14px;border-radius:8px 8px 0 0;padding:2px 10px;margin:0 2px;letter-spacing:.01em}
.blank.right{border-bottom-color:var(--green);color:var(--green);background:var(--green-soft)}
.blank.wrong{border-bottom-color:var(--red);color:var(--red);background:var(--red-soft)}
.cloze-answer{font-size:11.5px;color:var(--green);margin-left:6px;font-weight:600}

/* ============== 图表 ============== */
.chart-box{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}

/* ============== 数据概览 ============== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat-grid .cell{background:#FBF7F1;border-radius:10px;padding:11px 4px}
.stat-grid b{display:block;font-size:20px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.stat-grid span{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.me-list .btn{margin-bottom:8px}
details.struct summary{min-height:40px;display:flex;align-items:center;font-weight:600;cursor:pointer;font-size:14px;color:var(--ink);list-style:none}
details.struct summary::-webkit-details-marker{display:none}
details.struct summary::before{content:'▸';color:var(--muted);font-size:11px;margin-right:8px;transition:transform .15s ease;display:inline-block}
details.struct[open] summary::before{transform:rotate(90deg)}
table.struct-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.struct-tbl th,table.struct-tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left}
table.struct-tbl th{background:#FBF7F1;font-weight:600;color:var(--ink)}
table.struct-tbl td{color:var(--ink-2)}

/* ============== 弹窗 ============== */
.modal-mask{position:fixed;inset:0;z-index:80;background:rgba(30,41,59,.5);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:22px 22px 18px;width:100%;max-width:400px;max-height:86dvh;overflow:auto;box-shadow:0 20px 60px -20px rgba(30,41,59,.3)}
.modal h3{margin-bottom:12px;font-size:16px}
.modal img{width:100%;border-radius:12px;border:1px solid var(--line)}

/* ============== Toast ============== */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:100;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center;
  box-shadow:0 8px 24px -8px rgba(30,41,59,.4);
}
.toast.show{opacity:.95}

.hidden{display:none!important}

/* ============== 手机微调 ============== */
@media (max-width:767px){
  .btn.sm,.cal-toggle,.banner .x,.chip,.blank{min-height:40px}
  .banner .x{min-width:40px;padding:0}
  .chip{padding:6px 14px}
}

/* ============== 平板：顶部胶囊导航 + 今日双栏 ============== */
@media (min-width:768px){
  .app{padding-bottom:48px}
  .tabbar{
    position:static;border-top:none;background:transparent;justify-content:center;gap:8px;
    padding:0 0 20px;
  }
  .tabbar button{
    flex:none;flex-direction:row;gap:8px;padding:9px 20px;border-radius:99px;min-height:42px;
    background:#fff;box-shadow:var(--shadow-sm);font-size:13px;border:1px solid var(--line);
  }
  .tabbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabbar button.on::before{display:none}
  .tabbar button:hover:not(.on){background:#FBF7F1}
  /* ≥768：today-grid 双列对齐，两列等高，卡内 card-stretch 限制性撑高避免大空白 */
  .today-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;align-items:stretch}
  .today-grid .sub{display:flex;flex-direction:column;gap:14px;height:100%}
  .flip{max-width:480px}
}

/* <1024：移动端 .side 整列隐藏；hero 改紧凑横排两行（信息柱+CTA 一行，数据带一行），大字倒计时 */
@media (max-width:1023px){
  .side{display:none}
  /* mobile hero：grid 单列 + 深色背景，环绝对定位到右上角不影响行高，文字内边距避让 */
  .hero{display:grid;grid-template-columns:1fr;gap:10px;padding:14px 18px 14px 18px;border-radius:18px;margin-bottom:14px;background:#1E293B;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 36px -20px rgba(30,41,59,.35);position:relative;min-height:80px}
  .hero-l{flex:none;min-width:0;padding-right:140px;padding-bottom:8px;border-right:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:0}
  .hero-l .cd-label{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:.05em;display:inline;margin-right:4px}
  .hero-l .cd-num{font-size:54px;line-height:1;letter-spacing:-.03em;color:#fff;display:inline-block;margin:0 4px 0 0}
  .hero-l .cd-num span{font-size:14px;color:rgba(255,255,255,.6);margin-left:2px}
  .hero-l .cd-date{font-size:12px;color:rgba(255,255,255,.55);display:inline;margin-left:0}
  .hero-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-right:0}
  .hero-stat{min-width:0}
  .hero-stat b{font-size:20px}
  .hero-stat b i{font-size:12px}
  .hero-stat span{font-size:11px}
  .hero-prog{display:none}
  .hero-btn,.hero-done{flex:none;font-size:14px;padding:0 16px;min-height:38px;white-space:nowrap;margin-top:6px;justify-self:start;width:auto}
  /* mobile 词库进度大环绝对定位到右上角，不影响 flex 行高 */
  .hero-ring{position:absolute;top:14px;right:14px;width:120px;height:120px;flex:none;display:flex;align-items:center;justify-content:center;margin-left:0}
  .hero-ring svg{position:absolute;inset:0}
  .hero-ring span{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .ring-wrap{flex-direction:column;align-items:center;text-align:center;gap:10px}
  .ring{width:76px;height:76px}
  .ring svg{width:76px;height:76px}
  .ring .num b{font-size:20px}
  .cd-num{font-size:20px!important}
  .cd-num span{font-size:14px!important}
}

/* ============== 中等屏：分栏 ============== */
@media (min-width:900px){
  .quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;
    grid-template-areas:"a b" "chart chart" "c d" "f e"}
  .quiz-grid>.card{margin-bottom:0}
  .qz-a{grid-area:a}.qz-b{grid-area:b}.qz-chart{grid-area:chart}
  .qz-c{grid-area:c}.qz-d{grid-area:d}.qz-e{grid-area:e}.qz-f{grid-area:f}
  .quiz-stage{max-width:740px;margin:4px auto 0}
  .book-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px;align-items:start}
  .book-grid .card{margin-bottom:0}
  .book-grid .sub{display:flex;flex-direction:column;gap:14px}
  .me-cols{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:start}
  .me-cols .card{margin-bottom:0}
  .me-cols .sub{display:flex;flex-direction:column;gap:14px}
  .me-ov .stat-grid .cell{padding:14px 4px}
  .me-ov .stat-grid b{font-size:24px}
}

/* ============== 桌面：左侧边栏布局 ============== */
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:264px minmax(0,1fr);gap:24px;max-width:1360px;padding:24px 28px 56px;align-items:start}
  .side{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px}
  main{min-width:0}
  .today-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;align-items:start}
  .today-grid .sub{display:flex;flex-direction:column;gap:14px}
  header{flex-direction:column;align-items:stretch;gap:14px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}
  .brand{font-size:21px}
  .streak{justify-content:center;padding:8px 14px}
  .tabbar{flex-direction:column;align-items:stretch;gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow-sm)}
  .tabbar button{justify-content:flex-start;gap:10px;width:100%;padding:10px 14px;min-height:42px;border-radius:10px;background:transparent;border:none;box-shadow:none;font-size:13.5px;color:var(--ink-2);font-weight:500;transition:background .12s ease,color .12s ease}
  .tabbar button:hover{background:#FBF7F1;color:var(--ink)}
  .tabbar button.on{background:var(--ink);color:#fff;box-shadow:0 6px 14px -8px rgba(30,41,59,.4);font-weight:600}
  .tabbar button.on::before{display:none}
  .tabbar button.on svg{stroke:#fff}
  .tabbar button svg{stroke-width:1.8}
  .toast{bottom:36px}
  .flip{max-width:480px;height:min(58dvh,440px)}
  .deck-top,.deck-actions{max-width:800px;width:100%;margin:0 auto}
  .deck-actions{gap:14px}
  /* PC 端补充 */
  .pc-only{display:block}
  .pc-hide{display:none}
  /* Hero：左深色信息柱 + 右数据带（彻底告别"大橙色块"） */
  .hero{display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:24px;background:#1E293B;color:#fff;border-radius:20px;padding:22px 28px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 36px -20px rgba(30,41,59,.35);position:relative;overflow:hidden}
  .hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(234,88,12,.15);right:-60px;top:-90px;pointer-events:none}
  .hero-l{padding-right:24px;border-right:1px solid rgba(255,255,255,.12);position:relative;z-index:1}
  .hero .cd-num{color:#fff}
  .hero .cd-num span{color:rgba(255,255,255,.55)}
  .hero .cd-label{color:rgba(255,255,255,.6)}
  .hero .cd-date{color:rgba(255,255,255,.7)}
  .hero-r{display:flex;align-items:center;gap:24px;flex:1;position:relative;z-index:1}
  .hero-stat{min-width:90px}
  .hero-stat b{font-size:24px;display:block;line-height:1.1;color:#fff;font-weight:800;letter-spacing:-.02em}
  .hero-stat b i{font-size:13px;font-style:normal;font-weight:500;color:rgba(255,255,255,.6);margin-left:2px}
  .hero-stat span{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;display:block;letter-spacing:.04em}
  .hero-prog{flex:1;min-width:120px}
  .hero-prog .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .hero-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#FB923C,var(--orange));border-radius:99px}
  .hero-prog .lab{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.7);margin-top:6px;letter-spacing:.04em}
  .hero-prog .lab b{color:#fff;font-weight:700}
  .hero-btn{background:var(--orange);color:#fff;flex:none;box-shadow:0 6px 14px -7px rgba(234,88,12,.7)}
  .hero-btn:hover{background:#F97316}
  .hero-done{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;flex:none;color:rgba(255,255,255,.9);background:rgba(255,255,255,.1);padding:8px 14px;border-radius:10px}
  .hero-done svg{width:16px;height:16px;stroke:currentColor;color:#FB923C}
  /* 参考信息卡 PC 端强制展开 */
  details.struct>summary{pointer-events:none;cursor:default;min-height:0;font-size:14px;margin-bottom:10px;padding:0}
  details.struct>summary::before{display:none}
  /* 数据概览 6 格 */
  .me-ov .stat-grid{grid-template-columns:repeat(6,1fr)}
  /* 侧边栏今日待办 */
  .side-today .st-num{font-size:32px;font-weight:800;color:var(--ink);line-height:1.1;margin:2px 0 2px;letter-spacing:-.02em}
  .side-today .st-num b{color:var(--orange);font-size:14px;font-weight:600;margin-left:2px}
  .side-today .st-lab{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
  .side-today .btn{width:100%;margin-top:6px}
  .side-today .st-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:6px 0}
  .side-today .st-row b{color:var(--ink);font-weight:700}
  .side-today .st-row+.st-row{border-top:1px solid var(--line-soft)}
  .side-today .st-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--muted);line-height:1.5}
}
@media (prefers-reduced-motion:reduce){
  .flip{transition:none}
  .confetti{display:none}
  .stamp{animation:none}
  .btn{transition:none}
  .bar i{transition:none}
}
/* 真题题库模块 */
.opt-list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;border:1.6px solid var(--line);border-radius:12px;background:#fff;font-size:16px;line-height:1.5;color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt.sel{border-color:var(--orange);background:var(--orange-soft);font-weight:600}
.opt.ok{border-color:var(--green);background:#DCFCE7;color:#166534;font-weight:600}
.opt.no{border-color:var(--red);background:#FEE2E2;color:#991B1B;font-weight:600}
.opt:disabled{cursor:default}
.q-stem{font-size:16px;line-height:1.75;color:var(--ink);white-space:pre-line;margin:4px 0 2px}
.bank-fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.7}
.bank-fb.ok{background:#DCFCE7;color:#166534}
.bank-fb.no{background:#FEE2E2;color:#991B1B}
.bank-fb.ok .muted{color:#166534}
.bank-fb.no .muted{color:#7f1d1d}
.bank-audio{margin-bottom:12px}
/* 听力播放器 */
.bank-player{display:flex;align-items:center;gap:12px;background:var(--orange-soft);border:1px solid #FCD9B6;border-radius:14px;padding:12px;margin-bottom:14px}
.bank-player .ap-btn{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px -7px rgba(234,88,12,.7)}
.bank-player .ap-btn:hover{background:#F97316}
.bank-player .ap-btn svg{width:20px;height:20px;stroke:#fff}
.bank-player .ap-body{flex:1;min-width:0}
.bank-player .ap-bar{height:6px;border-radius:99px;background:#FCD9B6;overflow:hidden}
.bank-player .ap-fill{height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .15s linear}
.bank-player .ap-ctrls{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.bank-player .ap-time{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.bank-player .ap-ctrl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);flex:none}

function fmt(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return fmt(new Date());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d);}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function icon(n,sz){
  var p=ICONS[n]||'';var s=sz||18;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}
var TOAST_T=null;
function toast(msg){
  var el=$('#toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(TOAST_T);TOAST_T=setTimeout(function(){el.classList.remove('show');},2200);
}
function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance)return;
    var s=window.speechSynthesis;
    s.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-US';u.rate=.9;
    setTimeout(function(){try{if(s.resume)s.resume();s.speak(u);}catch(e){}},90);
  }catch(e){}
}
function canSpeak(){return ('speechSynthesis' in window)&&!!window.SpeechSynthesisUtterance;}
/* 听力播放（基于浏览器 TTS，点击即放，无语速/音量控件） */
var PS={playing:false,key:null};
function stopSpeak(){try{window.speechSynthesis.cancel();}catch(e){}PS.playing=false;PS.key=null;renderPlayBtn();}
function playScript(text,key){
  try{
    if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance||!text)return;
    var s=window.speechSynthesis;
    if(PS.playing&&PS.key===key){s.cancel();PS.playing=false;PS.key=null;renderPlayBtn();return;}
    s.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.95;u.volume=1;
    u.onend=function(){PS.playing=false;PS.key=null;renderPlayBtn();};
    u.onerror=function(){PS.playing=false;PS.key=null;renderPlayBtn();};
    PS.playing=true;PS.key=key;renderPlayBtn();
    setTimeout(function(){try{if(s.resume)s.resume();s.speak(u);}catch(e){}},90);
  }catch(e){}
}
function playBankScript(id){var it=BANK_MAP[id];if(it&&it.script)playScript(it.script,id);}
function renderPlayBtn(){
  var b=document.getElementById('apBtn');
  if(b)b.innerHTML=(PS.playing?icon('pause',16):icon('play',16))+' '+(PS.playing?'暂停':'播放听力');
}

/* ---------------- 状态读写 ---------------- */
function normalizeState(s){
  var d=sampleState();
  var base={version:1,settings:{},wordProgress:{},dailyQueue:null,vocab:[],practice:[],errors:[],checkins:[],dayStats:{},planChecks:{},writing:[],reading:[],dictation:[],listenPractice:{},readPractice:{},skillDone:{},sync:{},meta:{sample:{practice:[],errors:[],vocab:[],words:[]},backupDismiss:0,syncT:0}};
  if(!s||typeof s!=='object')return d;
  var out=base;
  out.settings.dailyNew=clamp(parseInt((s.settings||{}).dailyNew,10)||10,1,50);
  out.settings.dailyGoal=clamp(parseInt((s.settings||{}).dailyGoal,10)||5,1,50);
  out.settings.examDate=(s.settings&&s.settings.examDate)?String(s.settings.examDate):defaultExamDate();
  out.settings.bank=(s.settings&&s.settings.bank)?s.settings.bank:{attempts:0,correct:0,byType:{},done:{}};
  out.settings.level=(s.settings&&s.settings.level)||'CET4';
  if(s.wordProgress&&typeof s.wordProgress==='object'){
    Object.keys(s.wordProgress).forEach(function(k){
      var p=s.wordProgress[k];if(!p)return;
      out.wordProgress[k]={
        lv:clamp(parseInt(p.lv,10)||0,0,6),
        next:p.next?String(p.next).slice(0,10):todayStr(),
        dealt:!!p.dealt,
        wrongToday:parseInt(p.wrongToday,10)||0,
        wrongDate:p.wrongDate?String(p.wrongDate).slice(0,10):'',
        note:p.note||''
      };
    });
  }
  if(s.dailyQueue&&s.dailyQueue.date)out.dailyQueue={date:String(s.dailyQueue.date).slice(0,10),ids:Array.isArray(s.dailyQueue.ids)?s.dailyQueue.ids:[],done:Array.isArray(s.dailyQueue.done)?s.dailyQueue.done:[],newCount:parseInt(s.dailyQueue.newCount,10)||0};
  if(Array.isArray(s.vocab))out.vocab=s.vocab.filter(function(v){return v&&WMAP[v.wordId];}).map(function(v){return {wordId:v.wordId,addedAt:v.addedAt||todayStr(),note:v.note||''};});
  if(Array.isArray(s.practice))out.practice=s.practice.filter(function(p){return p&&p.date;}).map(function(p){return {id:p.id||uid(),date:String(p.date).slice(0,10),type:TYPES.indexOf(p.type)>=0?p.type:'阅读',total:parseInt(p.total,10)||0,correct:parseInt(p.correct,10)||0,note:p.note||''};});
  if(Array.isArray(s.errors))out.errors=s.errors.filter(function(e){return e&&e.id;}).map(function(e){
    var st=clamp(parseInt(e.stage,10)||0,0,ERR_INTERVALS.length-1);
    return {id:e.id,date:String(e.date||todayStr()).slice(0,10),type:TYPES.indexOf(e.type)>=0?e.type:'阅读',reason:REASONS.indexOf(e.reason)>=0?e.reason:'其他',question:e.question||'',idea:e.idea||'',stage:st,next:e.next?String(e.next).slice(0,10):addDays(String(e.date||todayStr()).slice(0,10),1),note:e.note||''};
  });
  if(Array.isArray(s.checkins))out.checkins=s.checkins.map(function(x){return String(x).slice(0,10);});
  if(s.dayStats&&typeof s.dayStats==='object')Object.keys(s.dayStats).forEach(function(k){out.dayStats[String(k).slice(0,10)]=parseInt(s.dayStats[k],10)||0;});
  if(s.planChecks&&typeof s.planChecks==='object'){out.planChecks={};Object.keys(s.planChecks).forEach(function(k){out.planChecks[String(k).slice(0,10)]=s.planChecks[k]||{};});}
  if(Array.isArray(s.writing))out.writing=s.writing.filter(function(x){return x&&x.id;}).map(function(x){return {id:x.id||uid(),date:String(x.date||todayStr()).slice(0,10),type:x.type==='翻译'?'翻译':'写作',topic:x.topic||'',text:x.text||'',graded:!!x.graded};});
  if(Array.isArray(s.reading))out.reading=s.reading.filter(function(x){return x&&x.id;}).map(function(x){return {id:x.id||uid(),date:String(x.date||todayStr()).slice(0,10),sentence:x.sentence||'',analysis:x.analysis||''};});
  if(Array.isArray(s.dictation))out.dictation=s.dictation.filter(function(x){return x&&x.id;}).map(function(x){return {id:x.id||uid(),date:String(x.date||todayStr()).slice(0,10),text:x.text||''};});
  if(s.listenPractice&&typeof s.listenPractice==='object'){out.listenPractice={};Object.keys(s.listenPractice).forEach(function(k){var r=s.listenPractice[k];if(r)out.listenPractice[k]={picked:r.picked==null?null:parseInt(r.picked,10),correct:!!r.correct,_t:r._t||0};});}
  if(s.readPractice&&typeof s.readPractice==='object'){out.readPractice={};Object.keys(s.readPractice).forEach(function(k){var r=s.readPractice[k];if(Array.isArray(r))out.readPractice[k]=r.map(function(v){return v==null?null:parseInt(v,10);});});}
  if(s.skillDone&&typeof s.skillDone==='object'){out.skillDone={};Object.keys(s.skillDone).forEach(function(k){out.skillDone[k]=!!s.skillDone[k];});}
  if(s.sync&&typeof s.sync==='object')out.sync=s.sync;
  if(s.meta&&s.meta.sample){
    ['practice','errors','vocab','words'].forEach(function(k){if(Array.isArray(s.meta.sample[k]))out.meta.sample[k]=s.meta.sample[k];});
  }
  if(s.meta)out.meta.backupDismiss=parseInt(s.meta.backupDismiss,10)||0;
  if(s.meta&&s.meta.settingsT)out.meta.settingsT=parseInt(s.meta.settingsT,10)||0;
  if(s.meta&&typeof s.meta.syncT==='number')out.meta.syncT=s.meta.syncT;
  return out;
}
function loadState(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw){var s=sampleState();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}return s;}
  try{return normalizeState(JSON.parse(raw));}
  catch(e){
    try{localStorage.setItem(KEY+'_broken',raw);localStorage.removeItem(KEY);}catch(e2){}
    var n=sampleState();
    setTimeout(function(){toast('数据异常已重置，可在「我的」导入备份恢复');},600);
    return n;
  }
}
var state=loadState();
function save(bump){
  if(bump!==false)wsyncTouch();
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){toast('存储空间不足，请先在「我的」导出备份');}
  if(bump!==false)wsyncPushSoon();
}

/* ================================================================
   云端同步层（资料库数据表）—— 单向：本地 save → 标记脏键 → 推送
   ================================================================ */
var db=null,ONLINE=false,LOCAL_ONLY=false;
var SCHEMA_OPTS={},SYNC_IDX={},DIRTY={},SYNCING=false,SYNC_MODE='init',SYNC_ERR='';
var REMOTE_ROWS=[];
try{if(window.__SMART_PAGE__&&window.__SMART_PAGE__.database){db=window.__SMART_PAGE__.database;ONLINE=true;}}catch(e){}

function dbInit(){
  if(!ONLINE){SYNC_MODE='off';renderSyncPill();return;}
  db.getSchema({databaseId:DATABASE_ID}).then(function(schema){
    (schema.properties||[]).forEach(function(f){
      if((f.type==='select'||f.type==='multi_select')&&f.config&&f.config.options)SCHEMA_OPTS[f.name]=f.config.options;
    });
    SYNC_IDX=state.sync||{};
    pullRemote(function(ok){
      SYNC_MODE=ok?'ok':'off';
      renderSyncPill();refreshAll();
      if(ok)syncFlush();
    });
  }).catch(function(){SYNC_MODE='off';renderSyncPill();});
}
function pullRemote(cb){
  if(!ONLINE||LOCAL_ONLY){if(cb)cb(false);return;}
  var all=[],cursor=null;
  function nextPage(){
    db.query({databaseId:DATABASE_ID,pageSize:100,startCursor:cursor}).then(function(r){
      all=all.concat(r.results||[]);
      if(r.hasMore&&r.nextCursor){cursor=r.nextCursor;nextPage();}
      else{REMOTE_ROWS=all;mergeRemote(all);if(cb)cb(true);}
    }).catch(function(){if(cb)cb(false);});
  }
  nextPage();
}
function optId(field,text){
  var list=SCHEMA_OPTS[field]||[];
  for(var i=0;i<list.length;i++)if(list[i].text===text)return list[i].id;
  return text;
}
function rowVal(v){return v==null?'':String(v);}
function parsePayload(s){try{return JSON.parse(s);}catch(e){return null;}}
/* 远端 → 本地：以 payload 内时间戳为准，远端新则覆盖 */
function mergeRemote(rows){
  if(!rows||!rows.length)return;
  var changed=false;
  rows.forEach(function(r){
    var key=rowVal(r['业务键']);if(!key)return;
    var recId=r._id||r.id;if(recId)SYNC_IDX[key]=recId;
    var p=parsePayload(rowVal(r['数据']));if(!p||!p._t)return;
    var local=localStamp(key);
    if(local&&local>=p._t)return;
    applyRemote(key,rowVal(r['类型']),p);
    changed=true;
  });
  if(changed){save();state.sync=SYNC_IDX;}
}
function localStamp(key){
  var o=localObject(key);
  return o&&o._t?o._t:0;
}
function localObject(key){
  var i=key.indexOf(':'),k=i<0?key:key.slice(0,i),v=i<0?'':key.slice(i+1);
  if(k==='settings'){var s=JSON.parse(JSON.stringify(state.settings));s._t=state.meta.settingsT||0;return s;}
  if(k==='word')return state.wordProgress[v]||null;
  if(k==='practice'){for(var a=0;a<state.practice.length;a++)if(state.practice[a].id===v)return state.practice[a];return null;}
  if(k==='error'){for(var b=0;b<state.errors.length;b++)if(state.errors[b].id===v)return state.errors[b];return null;}
  if(k==='vocab'){
    for(var c=0;c<state.vocab.length;c++)if(String(state.vocab[c].wordId)===v)return state.vocab[c];
    return null;
  }
  if(k==='day'){var dd=state.dayStats[v]||0;return {count:dd,checkin:state.checkins.indexOf(v)>=0,_t:new Date(v+'T00:00:00').getTime()};}
  return null;
}
function applyRemote(key,type,obj){
  var i=key.indexOf(':'),k=i<0?key:key.slice(0,i),v=i<0?'':key.slice(i+1);
  if(k==='settings'){state.settings.dailyNew=clamp(parseInt(obj.dailyNew,10)||10,1,50);state.settings.examDate=obj.examDate||state.settings.examDate;if(obj.bank)state.settings.bank=obj.bank;state.meta.settingsT=obj._t;}
  else if(k==='word'){state.wordProgress[v]={lv:clamp(obj.lv||0,0,6),next:obj.next||todayStr(),dealt:!!obj.dealt,wrongToday:obj.wrongToday||0,wrongDate:obj.wrongDate||'',_t:obj._t};}
  else if(k==='practice'){
    var found=false;
    for(var a=0;a<state.practice.length;a++)if(state.practice[a].id===v){state.practice[a]={id:v,date:obj.date,type:obj.type,total:obj.total,correct:obj.correct,_t:obj._t};found=true;}
    if(!found)state.practice.push({id:v,date:obj.date,type:obj.type,total:obj.total,correct:obj.correct,_t:obj._t});
  }
  else if(k==='error'){
    var f2=false;
    for(var b=0;b<state.errors.length;b++)if(state.errors[b].id===v){state.errors[b]={id:v,date:obj.date,type:obj.type,reason:obj.reason,question:obj.question,idea:obj.idea,stage:obj.stage||0,next:obj.next,_t:obj._t};f2=true;}
    if(!f2)state.errors.push({id:v,date:obj.date,type:obj.type,reason:obj.reason,question:obj.question,idea:obj.idea,stage:obj.stage||0,next:obj.next,_t:obj._t});
  }
  else if(k==='vocab'){
    var f3=false;
    for(var c=0;c<state.vocab.length;c++)if(String(state.vocab[c].wordId)===v){state.vocab[c]={wordId:parseInt(v,10),addedAt:obj.addedAt,_t:obj._t};f3=true;}
    if(!f3)state.vocab.push({wordId:parseInt(v,10),addedAt:obj.addedAt,_t:obj._t});
  }
  if(k==='day'){
    /* 日结数据多设备取最大值，打卡状态取并集 */
    var c=state.dayStats[v]||0;
    state.dayStats[v]=Math.max(c,parseInt(obj.count,10)||0);
    if(obj.checkin&&state.checkins.indexOf(v)<0)state.checkins.push(v);
  }
}
/* 本地 → 远端 */
function syncMark(key){DIRTY[key]=1;syncFlushSoon();}
function syncDrop(key){
  var rid=SYNC_IDX[key];
  delete DIRTY[key];
  if(rid&&ONLINE&&!LOCAL_ONLY){db.deleteRecord({databaseId:DATABASE_ID,recordId:rid}).catch(function(){});}
  delete SYNC_IDX[key];state.sync=SYNC_IDX;save();
}
var FLUSH_T=null;
function syncFlushSoon(){clearTimeout(FLUSH_T);FLUSH_T=setTimeout(syncFlush,400);}
function buildProps(key){
  var i=key.indexOf(':'),k=i<0?key:key.slice(0,i),v=i<0?'':key.slice(i+1);
  var o=localObject(key)||{};
  var props={'业务键':{text:key}};
  var payload=JSON.parse(JSON.stringify(o));
  payload._t=payload._t||Date.now();
  if(!payload._t)payload._t=Date.now();
  props['数据']={text:JSON.stringify(payload)};
  props['更新时间']={date:todayStr()};
  if(k==='settings'){props['类型']={select:optId('类型','设置')};}
  else if(k==='word'){
    props['类型']={select:optId('类型','背词进度')};
    var w=WMAP[parseInt(v,10)];
    props['单词']={text:w?w.w:''};
    props['状态']={select:optId('状态',o.lv>=6?'已掌握':(o.lv>=1?'学习中':'新词'))};
    props['复习间隔']={number:o.lv>=1?INTERVALS[clamp(o.lv-1,0,5)]:0};
    props['下次复习']={date:o.next||todayStr()};
  }
  else if(k==='practice'){props['类型']={select:optId('类型','刷题记录')};props['单词']={text:o.type||''};}
  else if(k==='error'){props['类型']={select:optId('类型','错题')};props['单词']={text:(o.type||'')+' · '+(o.reason||'')};}
  else if(k==='vocab'){props['类型']={select:optId('类型','生词')};var w2=WMAP[parseInt(v,10)];props['单词']={text:w2?w2.w:''};}
  else if(k==='day'){props['类型']={select:optId('类型','背词进度')};props['单词']={text:'日结 '+v};}
  return props;
}
function syncFlush(){
  if(!ONLINE||LOCAL_ONLY||SYNCING)return;
  var keys=Object.keys(DIRTY);
  if(!keys.length){SYNC_MODE='ok';renderSyncPill();return;}
  SYNCING=true;SYNC_MODE='ing';renderSyncPill();
  var k=keys[0];
  var props=buildProps(k);
  var rid=SYNC_IDX[k];
  var p=rid?db.updateRecord({databaseId:DATABASE_ID,recordId:rid,properties:props})
           :db.addRecord({databaseId:DATABASE_ID,properties:props});
  p.then(function(res){
    if(!rid&&res&&res.id)SYNC_IDX[k]=res.id;
    state.sync=SYNC_IDX;save();
    delete DIRTY[k];
    SYNCING=false;
    if(Object.keys(DIRTY).length){syncFlush();}
    else{SYNC_MODE='ok';renderSyncPill();renderSyncTable();}
  }).catch(function(e){
    delete DIRTY[k];SYNCING=false;SYNC_MODE='err';SYNC_ERR=String((e&&e.message)||'');
    renderSyncPill();
    if(SYNC_ERR.indexOf('404')>=0||SYNC_ERR.indexOf('not found')>=0){delete SYNC_IDX[k];state.sync=SYNC_IDX;save();DIRTY[k]=1;}
  });
}
function renderSyncPill(){
  var el=$('#syncPill');if(!el)return;
  var cls='off',txt='本地';
  if(SYNC_MODE==='ok'){cls='ok';txt='已同步';}
  else if(SYNC_MODE==='ing'){cls='ing';txt='同步中';}
  else if(SYNC_MODE==='err'){cls='off';txt='同步失败';}
  else if(SYNC_MODE==='init'){cls='ing';txt='连接中';}
  el.className='sync '+cls;
  el.innerHTML='<i></i><span>'+txt+'</span>';
}

/* ================================================================
   网页云同步层（Cloudflare Workers + KV）—— 不依赖资料库，独立站也可用
   口令 → SHA-256 派生 KV key + AES-GCM 密钥；进度整体加密存云端；
   登录即拉取（远端更新则覆盖本地），之后每次本地改动防抖推云端；
   每 45s 轮询一次，近实时跨设备同步。整体写入级 LWW（按时间戳）。
   ================================================================ */
var WSYNC={on:false,key:null,aes:null,hex:'',state:'off',last:0,pushing:false,timer:null,poll:null};
function wsB64FromBytes(bytes){
  var bin='',chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function wsBytesFromB64(b64){
  var bin=atob(b64),out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function wsHexToBytes(hex){
  var out=new Uint8Array(hex.length/2);
  for(var i=0;i<out.length;i++)out[i]=parseInt(hex.substr(i*2,2),16);
  return out;
}
function wsDerive(pass){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass)).then(function(buf){
    WSYNC.hex=[].map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
    return crypto.subtle.importKey('raw',buf,{name:'AES-GCM'},false,['encrypt','decrypt']);
  }).then(function(k){WSYNC.aes=k;});
}
function wsEncrypt(obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},WSYNC.aes,new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){
    return {iv:wsB64FromBytes(iv),data:wsB64FromBytes(new Uint8Array(ct))};
  });
}
function wsDecrypt(bundle){
  var iv=wsBytesFromB64(bundle.iv),ct=wsBytesFromB64(bundle.data);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},WSYNC.aes,ct).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
function wsApi(){return location.origin+'/api/sync';}
function wsyncTouch(){
  if(!WSYNC||!WSYNC.on)return;
  var n=Date.now();
  if(n>(state.meta.syncT||0))state.meta.syncT=n;
}
function wsyncPushSoon(){
  if(!WSYNC||!WSYNC.on||WSYNC.pushing)return;
  if(WSYNC.timer)clearTimeout(WSYNC.timer);
  WSYNC.timer=setTimeout(wsyncPush,800);
}
function wsyncPush(){
  if(!WSYNC||!WSYNC.on||WSYNC.pushing)return;
  WSYNC.pushing=true;WSYNC.state='ing';wsRenderSync();
  wsEncrypt({__t:state.meta.syncT||0,state:state}).then(function(bundle){
    return fetch(wsApi(),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({k:WSYNC.hex,iv:bundle.iv,data:bundle.data,t:state.meta.syncT||0})});
  }).then(function(r){return r.json();}).then(function(j){
    WSYNC.pushing=false;WSYNC.state=(j&&j.ok)?'ok':'err';WSYNC.last=Date.now();wsRenderSync();
    if(WSYNC.state==='err')toast('云端同步失败，稍后自动重试');
  }).catch(function(){
    WSYNC.pushing=false;WSYNC.state='err';wsRenderSync();
  });
}
function wsyncPull(cb){
  if(!WSYNC||!WSYNC.on){if(cb)cb(false);return;}
  fetch(wsApi()+'?k='+encodeURIComponent(WSYNC.hex)).then(function(r){
    if(r.status===404){if(cb)cb(false);return null;}
    if(!r.ok){if(cb)cb(false);return null;}
    return r.json();
  }).then(function(j){
    if(!j)return;
    wsDecrypt(j).then(function(payload){
      var remoteT=j.t||0;
      if(remoteT>(state.meta.syncT||0)){
        var ns=payload.state;
        if(ns&&typeof ns==='object'){
          Object.keys(state).forEach(function(k){delete state[k];});
          Object.assign(state,ns);
          state.meta=state.meta||{};state.meta.syncT=remoteT;
          save(false);
          refreshAll();
          if(cb)cb(true);
        } else {if(cb)cb(false);}
      } else {if(cb)cb(false);}
    }).catch(function(){if(cb)cb(false);});
  }).catch(function(){if(cb)cb(false);});
}
function wsyncLogin(pass,remember){
  if(!pass){toast('请输入同步口令');return;}
  if(!crypto||!crypto.subtle){toast('当前浏览器不支持加密同步');return;}
  WSYNC.state='ing';wsRenderSync();
  wsDerive(pass).then(function(){
    try{sessionStorage.setItem('wsync_k',WSYNC.hex);}catch(e){}
    if(remember){try{localStorage.setItem('wsync_k',WSYNC.hex);}catch(e){}}
    else{try{localStorage.removeItem('wsync_k');}catch(e){}}   /* 取消记住则清持久 key */
    WSYNC.on=true;
    wsyncPull(function(adopted){
      wsyncPush();
      WSYNC.state='ok';WSYNC.last=Date.now();
      wsRenderSync();renderWebSync();
      wsStartPoll();
      toast(adopted?'已从云端恢复进度':'已登录，进度已备份到云端');
    });
  }).catch(function(){WSYNC.state='err';wsRenderSync();toast('派生密钥失败');});
}
function wsyncLogout(){
  WSYNC.on=false;WSYNC.key=null;WSYNC.aes=null;WSYNC.hex='';WSYNC.state='off';
  try{sessionStorage.removeItem('wsync_k');}catch(e){}
  try{localStorage.removeItem('wsync_k');}catch(e){}   /* 同时清持久口令 */
  wsStopPoll();renderWebSync();toast('已退出网页云同步');
}
function wsyncAuto(){
  if(ONLINE)return; /* 资料库页用自己的同步 */
  var hex=null;
  try{hex=localStorage.getItem('wsync_k');}catch(e){}      /* 记住口令：本机持久 */
  if(!hex){try{hex=sessionStorage.getItem('wsync_k');}catch(e){}} /* 回退会话级 */
  if(!hex){renderWebSync();return;}
  WSYNC.hex=hex;WSYNC.on=true;WSYNC.state='ing';wsRenderSync();
  crypto.subtle.importKey('raw',wsHexToBytes(hex),{name:'AES-GCM'},false,['encrypt','decrypt']).then(function(k){
    WSYNC.aes=k;
    wsyncPull(function(adopted){WSYNC.state='ok';WSYNC.last=Date.now();wsRenderSync();renderWebSync();wsStartPoll();});
  }).catch(function(){WSYNC.on=false;WSYNC.state='off';wsRenderSync();renderWebSync();});
}
function wsStartPoll(){wsStopPoll();WSYNC.poll=setInterval(function(){wsyncPull(function(){});},45000);}
function wsStopPoll(){if(WSYNC.poll){clearInterval(WSYNC.poll);WSYNC.poll=null;}}
function wsRenderSync(){
  var el=document.getElementById('wsyncState');
  if(el)el.textContent=WSYNC.state==='ok'?'已同步':(WSYNC.state==='ing'?'同步中':(WSYNC.state==='err'?'同步失败':'未登录'));
  var p=document.getElementById('wsyncPill');
  if(p){
    if(WSYNC.on){
      p.style.display='';
      p.className='sync '+(WSYNC.state==='ok'?'ok':(WSYNC.state==='ing'?'ing':'off'));
      p.querySelector('span').textContent=(WSYNC.state==='ok'?'云同步':(WSYNC.state==='ing'?'同步中':'同步失败'));
    } else p.style.display='none';
  }
}
function renderWebSync(){
  var area=document.getElementById('wsyncArea');if(!area)return;
  if(!WSYNC.on){
    area.innerHTML='<div class="field"><input type="password" id="wsyncPass" placeholder="设置或输入同步口令" autocomplete="new-password"></div>'+
      '<label class="muted" style="display:flex;align-items:center;gap:6px;margin:10px 0;font-size:13px;cursor:pointer"><input type="checkbox" id="wsyncRemember" checked style="width:16px;height:16px"> 记住口令（本机自动登录，重启免输入）</label>'+
      '<button class="btn block" onclick="wsyncLogin(document.getElementById(\'wsyncPass\').value, document.getElementById(\'wsyncRemember\').checked)">'+icon('cloud',15)+'登录并同步</button>'+
      '<div class="muted" style="margin-top:8px">口令即账号；换设备用同一口令即可恢复进度。服务端只存 AES 加密密文，忘记无法找回。</div>';
  } else {
    var last=WSYNC.last?new Date(WSYNC.last).toLocaleString():'—';
    area.innerHTML='<div class="muted" style="margin-bottom:10px">已登录，进度加密同步中。上次：'+esc(last)+'</div>'+
      '<div class="me-list">'+
      '<button class="btn line block" onclick="wsyncPush()">'+icon('refresh',15)+'立即同步</button>'+
      '<button class="btn ghost block" onclick="wsyncLogout()">退出登录</button>'+
      '</div>';
  }
}

/* ================================================================
   计算层（只读 state，不改 DOM）
   ================================================================ */
function ensureQueue(t){
  var q=state.dailyQueue;
  if(q&&q.date===t)return q;
  var review=[],carry=[];
  for(var i=0;i<WORDS.length;i++){
    var w=WORDS[i],p=state.wordProgress[w.id];
    if(!p)continue;
    if(p.lv>=1){if(p.next<=t)review.push(w.id);}
    else if(p.dealt&&p.next<=t)carry.push(w.id);
  }
  var need=state.settings.dailyNew-carry.length;
  var fresh=[];
  if(need>0){
    for(var j=0;j<WORDS.length&&fresh.length<need;j++){
      var wj=WORDS[j];
      if(!state.wordProgress[wj.id]){
        state.wordProgress[wj.id]={lv:0,next:t,dealt:true,wrongToday:0,wrongDate:'',_t:Date.now()};
        fresh.push(wj.id);
      }
    }
  }
  var ids=review.concat(carry,fresh);
  state.dailyQueue={date:t,ids:ids,done:[],newCount:carry.length+fresh.length};
  for(var m=0;m<ids.length;m++)syncMark('word:'+ids[m]);
  save();
  return state.dailyQueue;
}
function queueLeft(t){
  var q=ensureQueue(t),left=[];
  for(var i=0;i<q.ids.length;i++)if(q.done.indexOf(q.ids[i])<0)left.push(q.ids[i]);
  return left;
}
function queueTotal(t){return ensureQueue(t).ids.length;}
function dueErrors(t){
  return state.errors.filter(function(e){return e.next<=t;})
    .sort(function(a,b){return a.next<b.next?-1:(a.next>b.next?1:0);});
}
function missPractice(t){
  var has={};
  state.practice.forEach(function(p){has[p.date]=1;});
  return has[t]?0:1;
}
function calcStreak(){
  var t=todayStr(),n=0,cur=t;
  var set={};state.checkins.forEach(function(d){set[d]=1;});
  if(!set[t])cur=addDays(t,-1);
  while(set[cur]){n++;cur=addDays(cur,-1);}
  return n;
}
function heatDays(){
  var t=todayStr(),out=[],start=addDays(t,-29);
  for(var i=0;i<30;i++){
    var d=addDays(start,i);
    out.push({date:d,count:state.dayStats[d]||0,isToday:d===t});
  }
  return out;
}
function heatLevel(c){return c<=0?0:(c<8?1:(c<16?2:3));}
function practiceSeries(){
  var t=todayStr(),out=[];
  for(var i=13;i>=0;i--){
    var d=addDays(t,-i),tot=0,cor=0;
    state.practice.forEach(function(p){if(p.date===d){tot+=p.total;cor+=p.correct;}});
    out.push({date:d,total:tot,correct:cor,rate:tot?Math.round(cor*100/tot):null});
  }
  return out;
}
function typeStat(){
  return TYPES.map(function(ty){
    var tot=0,cor=0;
    state.practice.forEach(function(p){if(p.type===ty){tot+=p.total;cor+=p.correct;}});
    return {type:ty,total:tot,correct:cor,rate:tot?Math.round(cor*100/tot):0};
  });
}
function todayDone(){return state.dayStats[todayStr()]||0;}
function dailyGoal(){return state.settings.dailyGoal||5;}
function maybeAutoCheckin(){
  var t=todayStr();
  if(todayDone()>=dailyGoal()&&state.checkins.indexOf(t)<0){
    state.checkins.push(t);save();syncMark('day:'+t);
    toast('今日任务完成，已自动打卡');return true;
  }
  return false;
}
function overview(){
  var learned=Object.keys(state.wordProgress).length;
  var mastered=0;
  Object.keys(state.wordProgress).forEach(function(k){if(state.wordProgress[k].lv>=6)mastered++;});
  var pt=0,pc=0;
  state.practice.forEach(function(p){pt+=p.total;pc+=p.correct;});
  return {
    learned:learned,mastered:mastered,total:WORDS.length,
    streak:calcStreak(),
    pTotal:pt,pRate:pt?Math.round(pc*100/pt):0,
    errCount:state.errors.length,todayDone:todayDone(),goal:dailyGoal(),
    vocabCount:state.vocab.length,
    records:state.practice.length+state.errors.length+state.vocab.length+learned
  };
}
function countdown(){
  var t=todayStr();
  return Math.max(0,diffDays(t,state.settings.examDate));
}

function lineChart(series){
  var W=560,H=170,PL=28,PR=8,PT=12,PB=24;
  var iw=W-PL-PR,ih=H-PT-PB;
  var pts=series.map(function(s,i){
    var x=PL+(series.length>1?i*iw/(series.length-1):0);
    var y=PT+ih-(s.rate==null?0:s.rate)*ih/100;
    return {x:x,y:y,s:s};
  });
  var grid='';
  [0,25,50,75,100].forEach(function(v){
    var y=PT+ih-v*ih/100;
    grid+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#EFEAE0" stroke-width="1"/>'+
          '<text x="4" y="'+(y+4).toFixed(1)+'" font-size="9" fill="#94A3B8">'+v+'</text>';
  });
  var valid=pts.filter(function(p){return p.s.rate!=null;});
  var d=valid.map(function(p,i){return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' ');
  var dots=valid.map(function(p){return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#fff" stroke="#EA580C" stroke-width="2"><title>'+p.s.date+' · '+p.s.rate+'%</title></circle>';}).join('');
  var labels=pts.map(function(p,i){
    if(i%3!==0&&i!==pts.length-1)return '';
    return '<text x="'+p.x.toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#94A3B8" text-anchor="middle">'+p.s.date.slice(5)+'</text>';
  }).join('');
  var area=valid.length?('<path d="'+d+' L'+valid[valid.length-1].x.toFixed(1)+' '+(PT+ih)+' L'+valid[0].x.toFixed(1)+' '+(PT+ih)+' Z" fill="rgba(234,88,12,.08)"/>'):'';
  var emptyTip=valid.length?'':'<text x="'+(W/2)+'" y="'+(PT+ih/2)+'" font-size="12" fill="#94A3B8" text-anchor="middle">近 14 天还没有记录</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px" role="img" aria-label="近 14 天正确率折线图">'+grid+area+
    (valid.length?'<path d="'+d+'" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
    dots+labels+emptyTip+'</svg>';
}

var deck={open:false,list:[],idx:0,flipped:false};
function openDeck(){
  var t=todayStr();
  deck.list=queueLeft(t);
  if(!deck.list.length){toast('今日队列已清空');return;}
  deck.idx=0;deck.flipped=false;deck.open=true;
  var m=$('#deckMask');m.classList.add('show');m.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  renderDeck();
}
function closeDeck(){
  deck.open=false;
  var m=$('#deckMask');m.classList.remove('show');m.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  refreshAll();
}
function renderDeck(){
  var m=$('#deckMask');if(!m)return;
  if(deck.idx>=deck.list.length){renderFinish(m);return;}
  var w=WMAP[deck.list[deck.idx]];
  if(!w){deck.idx++;renderDeck();return;}
  m.innerHTML=
    '<div class="deck-top">'+
      '<button class="deck-close" onclick="closeDeck()">关闭</button>'+
      '<div class="prog">'+(deck.idx+1)+' / '+deck.list.length+'</div>'+
      '<div style="width:64px"></div>'+
    '</div>'+
    '<div class="flip-zone">'+
      '<div class="flip'+(deck.flipped?' flipped':'')+'" id="flipCard" onclick="flipCard()" role="button" tabindex="0" aria-label="翻转卡片">'+
        '<div class="face">'+
          '<div class="word">'+esc(w.w)+'</div>'+
          '<div class="phonetic">'+esc(w.ph)+'</div>'+
          (canSpeak()?'<button class="speak-btn" onclick="event.stopPropagation();speak(\''+esc(w.w)+'\')" aria-label="朗读">'+icon('vol',20)+'</button>':'')+
          '<div class="hint">点卡片翻面看释义</div>'+

          '<div class="pos">'+esc(w.pos)+'</div>'+
          '<div class="def">'+esc(w.def)+'</div>'+
          '<div class="coll">'+esc(w.coll)+'</div>'+
          '<div class="hint">还记得住吗？</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="deck-actions">'+
      '<button class="btn gray" onclick="answerCard(false)">不认识</button>'+
      '<button class="btn" onclick="answerCard(true)">认识</button>'+
    '</div>';
}
function renderFinish(m){
  var t=todayStr();
  var done=queueTotal(t);
  if(state.checkins.indexOf(t)<0){state.checkins.push(t);}
  state.dayStats[t]=(state.dayStats[t]||0)+done;
  syncMark('day:'+t);
  save();
  m.innerHTML='<div class="deck-top"><button class="deck-close" onclick="closeDeck()">关闭</button>'+
    '<div class="prog">完成</div><div style="width:64px"></div></div>'+
    '<div class="finish-wrap"><div class="stamp">今日清空</div>'+
    '<div class="muted" style="margin-top:16px">今天过了 '+done+' 个词，连续 '+calcStreak()+' 天</div>'+
    '<div class="row" style="margin-top:22px;gap:10px">'+
      '<button class="btn ghost" onclick="makePoster()">'+icon('down',15)+'存战绩图</button>'+
      '<button class="btn" onclick="closeDeck()">回首页</button>'+
    '</div></div>';
  celebrate();
}
function flipCard(){deck.flipped=!deck.flipped;var f=$('#flipCard');if(f)f.classList.toggle('flipped',deck.flipped);}
function answerCard(known){
  if(!deck.open)return;
  var t=todayStr(),id=deck.list[deck.idx];
  if(id==null)return;
  var p=state.wordProgress[id]||{lv:0,next:t,dealt:true,wrongToday:0,wrongDate:''};
  var q=ensureQueue(t);
  if(known){
    p.lv=clamp(p.lv+1,0,6);
    p.next=addDays(t,INTERVALS[clamp(p.lv-1,0,5)]);
    p.wrongToday=0;p.wrongDate='';
    if(q.done.indexOf(id)<0)q.done.push(id);
    state.dayStats[t]=(state.dayStats[t]||0)+1;
  }else{
    p.lv=0;
    p.wrongToday=(p.wrongDate===t?(p.wrongToday||0)+1:1);
    p.wrongDate=t;
    addVocabSilent(id);
    if(p.wrongToday>=3){
      p.next=addDays(t,1);
      if(q.done.indexOf(id)<0)q.done.push(id);
      toast('连错 3 次，这个词改到明天');
    }else{
      p.next=t;
      /* 回到今日队尾 */
      var pos=deck.list.indexOf(id);
      if(pos>=0)deck.list.splice(pos,1);
      deck.list.push(id);
      deck.idx--;
    }
  }
  p._t=Date.now();
  state.wordProgress[id]=p;
  state.dailyQueue=q;
  save();
  syncMark('word:'+id);
  syncMark('day:'+t);
  deck.flipped=false;
  deck.idx++;
  if(deck.idx>=deck.list.length){renderFinish($('#deckMask'));}
  else{renderDeck();}
}
function addVocabSilent(id){
  for(var i=0;i<state.vocab.length;i++)if(state.vocab[i].wordId===id)return;
  state.vocab.push({wordId:id,addedAt:todayStr(),_t:Date.now()});
  syncMark('vocab:'+id);
}
function celebrate(){
  var colors=['#EA580C','#FB923C','#16A34A','#2563EB','#9333EA','#D97706'];
  for(var i=0;i<26;i++){
    (function(i){
      var el=document.createElement('i');
      el.className='confetti';
      el.style.left=(Math.random()*100)+'%';
      el.style.background=colors[i%colors.length];
      el.style.animationDelay=(Math.random()*.5)+'s';
      document.body.appendChild(el);
      setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},2600);
    })(i);
  }
}

  {id:'rp2',title:'Passage Two（2002 年 1 月真题）',passage:"Foxes and farmers have never got on well. These small dog-like animals have long been accused of killing farm animals. They are officially classified as harmful and farmers try to keep their numbers down by shooting or poisoning them. Farmers can also call on the services of their local hunt to control the fox population. Hunting consists of pursuing a fox across the countryside, with a group of specially trained dogs, followed by men and women riding horses. When the dogs eventually catch the fox they kill it or a hunter shoots it. People who take part in hunting think of as a sport; they wear a special uniform of red coats and white trousers, and follow strict codes of behavior. But owning a horse and hunting regularly is expensive, so most hunters are wealthy. It is estimated that up to 100,000 people watch or take part in fox hunting. But over the last couple of decades the number of people opposed to fox hunting, because they think it is brutal, has risen sharply. Nowadays it is rare for a hunt to pass off without some kind of confrontation between hunters and hunt saboteurs. Sometimes these incidents lead to violence, but mostly saboteurs interfere with the hunt by misleading riders and disturbing the trail of the fox's smell, which the dogs follow. Noisy confrontations between hunters and saboteurs have become so common that they are almost as much a part of hunting as the pursuit of foxes itself. But this year supporters of fox hunting face a much bigger threat to their sport. A Labour Party Member of the Parliament, Mike Foster, is trying to get Parliament to approve a new law which will make the hunting of wild animals with dogs illegal. If the law is passed, wild animals like foxes will be protected under the ban in Britain.",
    qs:[

      {q:'What is special about fox hunting in Britain?',opts:['It involves the use of a deadly poison.','It is a costly event which rarely occurs.','The hunters have set rules to follow.','The hunters have to go through strict training.'],ans:2,exp:'原文：they follow strict codes of behavior——猎手有严格的行为规范要遵守。'},

      {q:'A new law may be passed by the British Parliament to ________.',opts:['prohibit farmers from hunting foxes','forbid hunting foxes with dogs','stop hunting wild animals in the countryside','prevent large-scale fox hunting'],ans:1,exp:'原文：make the hunting of wild animals with dogs illegal——禁止用狗猎杀野生动物。'},
      {q:'It can be inferred from the passage that ________.',opts:['killing foxes with poison is illegal','limiting the fox population is unnecessary','hunting foxes with dogs is considered cruel and violent','fox-hunting often leads to confrontation between the poor and the rich'],ans:2,exp:'反对者认为猎狐残酷（brutal），且常发生对抗，可推知用狗猎狐被视为残忍暴力。'}

  {id:'rp3',title:'Passage Three（2002 年 1 月真题）',passage:"For an increasing number of students at American universities, Old is suddenly in. The reason is obvious: the graying of America means jobs, coupled with the aging of the baby-boom generation, a longer life span means that the nation's elderly population is bound to expand significantly over the next 50 years. By 2050, 25 percent of all Americans will be older than 65, up from 14 percent in 1995. The change poses profound questions for government and society, of course. But it also creates career opportunities in medicine and health professions, and in law and business as well. \"In addition to the doctors, we're going to need more sociologists, biologists, urban planners and specialized lawyers,\" says Professor Edward Schneider of the University of Southern California's School of Gerontology. Lawyers can specialize in \"elder law,\" which covers everything from trusts and estates to nursing-home abuse and age discrimination. Businessmen see huge opportunities in the elder market because the baby boomers, 74 million strong, are likely to be the wealthiest group of retirees in human history. \"Any student who combines an expert knowledge in gerontology with, say, an MBA or law degree will have a license to print money,\" one professor says. Margarite Santos is a 21-year-old senior at USC. She began college as a biology major but found she was \"really bored with bacteria.\" So she took a class in gerontology and discovered that she liked it. She says, \"I did volunteer work in retirement homes and it was very satisfying.\"",
    qs:[

      {q:'With the aging of America, lawyers can benefit ________.',opts:['from the adoption of the "elder law"','from rendering special services to the elderly','by enriching their professional knowledge','by winning the trust of the elderly to promote their own interests'],ans:1,exp:'律师可专攻 elder law 为老人提供专门服务而获益。'},
      {q:'Why can businessmen make money in the emerging elder market?',opts:['Retirees are more generous in spending money.','They can employ more gerontologists.','The elderly possess an enormous purchasing power.','There are more elderly people working than before.'],ans:2,exp:'婴儿潮一代是有史以来最富裕的退休群体，老人有巨大购买力。'},
      {q:'Who can make big money in the new century according to the passage?',opts:['Retirees who are business-minded.','The volunteer workers in retirement homes.','College graduates with an MBA or law degree.','Professionals with a good knowledge of gerontology.'],ans:3,exp:'原文：combines gerontology knowledge with MBA/law = license to print money——懂老年学的专业人才。'},

  {id:'rp4',title:'Passage Four（2002 年 1 月真题）',passage:"The decline in moral standards—which has long concerned social analysts—has at last captured the attention of average Americans. And Jean Bethke Elshtain, for one, is glad. The fact the ordinary citizens are now starting to think seriously about the nation's moral climate, says this ethics professor at the University of Chicago, is reason to hope that new ideas will come forward to improve it. But the challenge is not to be underestimated. Materialism and individualism in American society are the biggest obstacles. \"The thought that 'I'm in it for me' has become deeply rooted in the national consciousness,\" Ms. Elshtain says. Some of this can be attributed to the disintegration of traditional communities, in which neighbors looked out for one another, she says. With today's greater mobility and with so many couples working, those bonds have been weakened, replaced by a greater emphasis on self. In a 1996 poll of Americans, loss of morality topped the list of the biggest problems facing the U.S. and Elshtain says the public is correct to sense that: Data show that Americans are struggling with problems unheard of in the 1950s, such as classroom violence and a high rate of births to unmarried mothers. The desire for a higher moral standard is not a lament for some nonexistent \"golden age,\" Elshtain says, nor is it a wishful longing for a time that denied opportunities to women and minorities. Most people, in fact, favor the lessening of prejudice. Moral decline will not be reversed until people find ways to counter the materialism in society, she says. \"Slowly, you recognize that the things that matter are those that can't be bought.\"",
    qs:[

      {q:'Which of the following characterizes the traditional communities?',opts:['Great mobility.','Concern for one\'s neighbors.','Emphasis on individual effort.','Ever-weakening social bonds.'],ans:1,exp:'原文：traditional communities, in which neighbors looked out for one another——邻里互相关照。'},

      {q:'According to Elshtain, the current moral decline may be reversed ________.',opts:['if people can return to the "golden age"','when women and men enjoy equal rights','when people rid themselves of prejudice','if less emphasis is laid on material things'],ans:3,exp:'原文：Moral decline will not be reversed until... counter the materialism——弱化对物质的强调。'}

function addReading(){
  var s=$('#rSent')?($('#rSent').value||'').trim():'';

  state.reading=state.reading||[];
  state.reading.push({id:uid(),date:todayStr(),sentence:s,analysis:a});
  save();refreshAll();toast('已保存');
}
function delReading(id){state.reading=(state.reading||[]).filter(function(x){return x.id!==id;});save();refreshAll();}

function reviewError(id){
  for(var i=0;i<state.errors.length;i++){
    if(state.errors[i].id===id){
      var e=state.errors[i];
      e.stage=clamp(e.stage+1,0,ERR_INTERVALS.length-1);
      e.next=addDays(todayStr(),ERR_INTERVALS[e.stage]);
      e._t=Date.now();
      syncMark('error:'+id);
      toast('已进入第 '+(e.stage+1)+' 轮，'+ERR_INTERVALS[e.stage]+' 天后再见');
      break;
