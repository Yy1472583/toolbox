function manualSync(){
  if(!ONLINE){toast('当前为离线模式');return;}
  SYNC_MODE='ing';renderSyncPill();
  pullRemote(function(ok){
    SYNC_MODE=ok?'ok':'off';
    renderSyncPill();
    if(ok){
      Object.keys(state.wordProgress).forEach(function(k){syncMark('word:'+k);});
      state.practice.forEach(function(p){syncMark('practice:'+p.id);});
      state.errors.forEach(function(e){syncMark('error:'+e.id);});

function importJSON(input){
  var f=input.files&&input.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var data=JSON.parse(rd.result);
      var s=data&&data.state?data.state:data;
      state=normalizeState(s);
      SYNC_IDX=state.sync||{};
      save();refreshAll();
      toast('导入成功');
    }catch(e){toast('文件格式不对，导入失败');}
    input.value='';
  };
  rd.readAsText(f);
}
function exportCSV(){
  var rows=[['日期','模块','做题数','正确数','正确率']];
  state.practice.slice().sort(function(a,b){return a.date<b.date?1:-1;}).forEach(function(p){
    rows.push([p.date,p.type,p.total,p.correct,(p.total?Math.round(p.correct*100/p.total):0)+'%']);
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  download('四级刷题记录_'+todayStr()+'.csv',url);
  setTimeout(function(){URL.revokeObjectURL(url);},3000);
  toast('已导出 CSV');
}

 {id:'b27',type:'听力',script:"W: The meeting is at three, but Tom is ten minutes late. M: Again? He is always late.",q:'When does the meeting start?',opts:['At 3:00','At 3:10','At 2:50','At 4:00'],ans:0,exp:'会议三点开始，Tom 迟到 10 分钟。'},
 {id:'b28',type:'听力',script:"M: How much is the red shirt? W: It was 80 yuan, but now it is half price.",q:'What is the price now?',opts:['80 yuan','40 yuan','160 yuan','20 yuan'],ans:1,exp:'半价 → 40 元。'},
 {id:'b29',type:'听力',script:"W: I am going to the library to return these books. M: Can you borrow a novel for me?",q:'What will the woman do?',opts:['Return books','Borrow a novel','Buy a book','Read a newspaper'],ans:0,exp:'女士要去图书馆还书。'},
 {id:'b30',type:'听力',script:"M: The weather report says it will rain tomorrow. W: Then we have to cancel the picnic.",q:'What will happen to the picnic?',opts:['It will be held as planned','It will be cancelled','It will move indoors','It will start earlier'],ans:1,exp:'因为下雨，野餐要取消。'}
];
var BANK_MAP={};BANK.forEach(function(x){BANK_MAP[x.id]=x;});
var bankSession=null;
function viewBank(){
  if(bankSession)return bankSessionHtml();
  var b=state.settings.bank||{attempts:0,correct:0,byType:{},done:{}};
  var doneN=Object.keys(b.done||{}).length;
  var rate=b.attempts?Math.round(b.correct/b.attempts*100):0;
  return ''
   +'<div class="card"><div class="section-head"><h4>四六级真题 · 仿真题库</h4></div>'
   +'<p class="muted">题库练习型：阅读 / 完形 / 词汇 / 听力 选择题，选完自动判分，答错自动进错本（走复习曲线）。听力由浏览器朗读自写脚本，无需音频文件。</p></div>'
   +'<div class="card"><div class="stat-grid">'
   +'<div class="cell"><b>'+doneN+'</b><span>已练题</span></div>'
   +'<div class="cell"><b>'+(BANK.length-doneN)+'</b><span>未练题</span></div>'
   +'<div class="cell"><b>'+(b.attempts||0)+'</b><span>总作答</span></div>'
   +'<div class="cell"><b style="color:'+(rate>=60?'var(--green)':'var(--red)')+'">'+rate+'%</b><span>正确率</span></div>'
   +'</div>'
   +'<div class="muted" style="margin-top:10px">阅读 '+(byTypeRate(b,'阅读'))+' · 完形 '+(byTypeRate(b,'完形'))+' · 词汇 '+(byTypeRate(b,'词汇'))+' · 听力 '+(byTypeRate(b,'听力'))+'</div></div>'
   +'<div class="card"><div class="row" style="gap:10px">'
   +'<button class="btn grow" onclick="startBank()">'+icon('zap',16)+' 开始练习（10题）</button>'
   +'<button class="btn gray" onclick="resetBank()">重置统计</button></div>'
   +'<button class="btn line block" style="margin-top:10px" onclick="switchTab(\'book\')">查看错本</button></div>'
   +'<div class="card-soft"><b style="color:var(--ink-2)">说明</b><p class="muted" style="margin-top:6px">题为按四级真题题型与难度编写的模拟题（非官方原题，规避版权）。想要更多题、换题型，或想接你自己的官方音频，告诉我即可扩充。</p></div>';
}
function byTypeRate(b,t){
  var o=b.byType&&b.byType[t];if(!o||!o.a)return '—';
  return o.c+'/'+o.a+' ('+Math.round(o.c/o.a*100)+'%)';
}
function bankSessionHtml(){
  if(bankSession.idx>=bankSession.list.length)return bankSummaryHtml();
  return bankQHtml();
}
/* playScript 已移除，改用 AP 听力播放器 */
function bankQHtml(){
  var id=bankSession.list[bankSession.idx];
  var it=BANK_MAP[id];
  var total=bankSession.list.length;
  var playerHtml=it.script?('<div class="bank-player"><button class="btn grow" id="apBtn" onclick="playBankScript(\''+it.id+'\')">'+icon('play',16)+' 播放听力</button></div>'):'';

  var optsHtml=it.opts.map(function(o,i){
    var cls='opt',dis='';
    if(bankSession.graded){dis='disabled';if(i===it.ans)cls+=' ok';if(i===bankSession.sel&&i!==it.ans)cls+=' no';}
    else if(bankSession.sel===i)cls+=' sel';
    return '<button class="'+cls+'" '+dis+' onclick="bankSelect('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>';
  }).join('');
  var fb='';
  if(bankSession.graded){
    var ok=bankSession.sel===it.ans;
    fb='<div class="bank-fb '+(ok?'ok':'no')+'"><b>'+(ok?'回答正确':'回答错误')+'</b>　正确答案：'+String.fromCharCode(65+it.ans)+'. '+esc(it.opts[it.ans])+'<br><span class="muted">解析：'+esc(it.exp)+'</span></div>';
    if(it.script)fb+='<div class="muted" style="margin-top:8px">听力原文：'+esc(it.script)+'</div>';
  }
  var foot=bankSession.graded
    ? '<button class="btn grow" onclick="bankNext()">'+(bankSession.idx>=total-1?'查看结果':'下一题')+'</button>'
    : '<button class="btn grow" '+((bankSession.sel==null)?'disabled':'')+' onclick="bankGrade()">提交</button>';
  return '<div class="card"><div class="row" style="margin-bottom:10px"><span class="badge orange">'+it.type+'</span><span class="grow muted" style="text-align:right">第 '+(bankSession.idx+1)+' / '+total+' 题</span></div>'
   +playerHtml
   +'<div class="q-stem">'+esc(it.q)+'</div>'
   +'<div class="opt-list">'+optsHtml+'</div>'+fb+foot+'</div>';
}
function bankSummaryHtml(){
  var r=bankSession.results,n=r.length,c=0;for(var i=0;i<r.length;i++)if(r[i])c++;
  return '<div class="card" style="text-align:center"><h3 style="justify-content:center">本轮练习完成</h3>'
   +'<div class="cd-num" style="margin:10px 0">'+c+'<span>/ '+n+' 正确</span></div>'
   +'<div class="muted">正确率 '+Math.round(c/n*100)+'%</div>'
   +'<div class="row" style="margin-top:14px;gap:10px">'
   +'<button class="btn gray grow" onclick="switchTab(\'book\')">去错本复习</button>'
   +'<button class="btn grow" onclick="startBank()">再来一组</button></div></div>';
}
function startBank(){
  stopSpeak();
  var ids=BANK.map(function(x){return x.id;});
  for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t;}
  bankSession={list:ids.slice(0,Math.min(10,ids.length)),idx:0,sel:null,graded:false,results:[]};
  refreshAll();
}
function bankSelect(i){if(bankSession.graded)return;bankSession.sel=i;refreshAll();}
function bankGrade(){
  if(bankSession===null||bankSession.graded||bankSession.sel==null)return;
  var it=BANK_MAP[bankSession.list[bankSession.idx]];
  var ok=bankSession.sel===it.ans;
  bankSession.results.push(ok);bankSession.graded=true;
  var b=state.settings.bank;if(!b.byType)b.byType={};if(!b.byType[it.type])b.byType[it.type]={a:0,c:0};
  b.byType[it.type].a++;if(ok)b.byType[it.type].c++;
  b.attempts++;if(ok)b.correct++;if(!b.done)b.done={};b.done[it.id]=1;
  var td=todayStr();state.dayStats[td]=(state.dayStats[td]||0)+1;
  save();syncMark('settings');
  maybeAutoCheckin();
  if(!ok){
    var id=uid();
    state.errors.push({id:id,date:todayStr(),type:it.type,reason:'题库答错',question:it.q,idea:'正确答案：'+it.opts[it.ans]+'。'+it.exp,stage:0,next:addDays(todayStr(),ERR_INTERVALS[0]),_t:Date.now()});
    save();syncMark('error:'+id);toast('答错，已记入错本');
  }else{toast('回答正确');}
  refreshAll();
}
function bankNext(){
  if(bankSession===null)return;
  stopSpeak();
  if(bankSession.idx>=bankSession.list.length-1){bankSession.idx=bankSession.list.length;refreshAll();return;}
  bankSession.idx++;bankSession.sel=null;bankSession.graded=false;refreshAll();
}
function resetBank(){
  if(!confirm('确定清空真题练习统计？已记入错本的题不会删除。'))return;
  state.settings.bank={attempts:0,correct:0,byType:{},done:{}};save();syncMark('settings');refreshAll();
}

/* ================================================================
   初始化（固定顺序：载入数据 → 初始化状态 → 统一渲染 → 连接云端）
   ================================================================ */
document.addEventListener('DOMContentLoaded',function(){
  SYNC_IDX=state.sync||{};
  ensureQueue(todayStr());
  renderSyncPill();
  refreshAll();
  if(ONLINE)dbInit();else{SYNC_MODE='off';renderSyncPill();}
  if(!ONLINE)wsyncAuto();
  $('#modalMask').addEventListener('click',function(e){if(e.target===this)closeModal();});
  $('#posterMask').addEventListener('click',function(e){if(e.target===this)closePoster();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeModal();closePoster();}
  });
});
</script>
